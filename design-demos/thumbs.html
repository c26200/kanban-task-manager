<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kanban Flow — six candidates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #d9d9d4; padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(3, 480px); gap: 18px; width: max-content; }
  .cell { width: 480px; }
  figcaption { font: 500 10px/1 "Inter", sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #333; padding: 7px 0 0; }
  .thumb { width: 480px; height: 300px; position: relative; overflow: hidden; outline: 1px solid rgba(0,0,0,.15); }
  .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

  /* 1 Rams */
  .t1 { background: #E8E8E6; color: #1A1A1A; padding: 12px 14px; font-family: "Inter", sans-serif; }
  .t1 .h { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #C9C9C6; padding-bottom: 5px; }
  .t1 .h b { font-size: 12px; letter-spacing: -.01em; }
  .t1 .h span { font-family: "JetBrains Mono", monospace; font-size: 6px; color: #777; }
  .t1 .cols { margin-top: 8px; }
  .t1 .col { background: #F7F7F5; border: 1px solid #D8D8D5; padding: 6px; }
  .t1 .ch { display: flex; justify-content: space-between; font-size: 6px; letter-spacing: .1em; color: #666; border-bottom: 1px solid #E3E3E0; padding-bottom: 3px; }
  .t1 .card { background: #FFF; border: 1px solid #E0E0DD; padding: 5px; margin-top: 5px; font-size: 6.5px; line-height: 1.35; }
  .t1 .accent { height: 3px; background: #E64A19; width: 26px; margin-top: 4px; }

  /* 2 Vignelli */
  .t2 { background: #FFF; color: #111; padding: 12px 14px; font-family: "Archivo", sans-serif; }
  .t2 .h { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 6px solid #D0021B; padding-bottom: 4px; }
  .t2 .h b { font-size: 20px; font-weight: 900; letter-spacing: -.02em; }
  .t2 .h span { font-size: 6px; letter-spacing: .1em; }
  .t2 .cols { margin-top: 8px; }
  .t2 .col { border-top: 2px solid #111; padding-top: 4px; }
  .t2 .ch { font-size: 7px; font-weight: 700; letter-spacing: .08em; }
  .t2 .card { border-bottom: 1px solid #DDD; padding: 5px 0; font-size: 6.5px; line-height: 1.35; }

  /* 3 Linear */
  .t3 { background: #0B0D12; color: #E8EAF0; padding: 10px 12px; font-family: "Inter", sans-serif; display: grid; grid-template-columns: 70px 1fr; gap: 8px; }
  .t3 .rail { border-right: 1px solid #1E232E; padding-right: 6px; font-family: "JetBrains Mono", monospace; font-size: 5.5px; line-height: 2.2; color: #7C8595; }
  .t3 .rail b { color: #7C5CFF; }
  .t3 .h { display: flex; justify-content: space-between; font-size: 7px; }
  .t3 .cols { margin-top: 6px; gap: 5px; }
  .t3 .col { border: 1px solid #1E232E; padding: 5px; }
  .t3 .ch { display: flex; justify-content: space-between; font-family: "JetBrains Mono", monospace; font-size: 5px; color: #7C8595; border-bottom: 1px solid #1E232E; padding-bottom: 3px; }
  .t3 .card { background: #10141C; border: 1px solid #242A36; border-radius: 3px; padding: 4px; margin-top: 4px; font-size: 5.5px; line-height: 1.35; }
  .t3 .tag { display: inline-block; background: rgba(124,92,255,.18); color: #A78BFF; font-size: 4.5px; padding: 1px 3px; margin-top: 2px; }

  /* 4 Trello */
  .t4 { background: #0079BF; color: #172B4D; padding: 10px 12px; font-family: "Inter", sans-serif; }
  .t4 .h { display: flex; justify-content: space-between; font-size: 7px; color: #FFF; }
  .t4 .cols { margin-top: 7px; gap: 6px; }
  .t4 .col { background: #EBECF0; border-radius: 4px; padding: 5px; }
  .t4 .ch { font-size: 6px; font-weight: 700; }
  .t4 .card { background: #FFF; border-radius: 3px; padding: 4px; margin-top: 4px; font-size: 5.5px; line-height: 1.35; box-shadow: 0 1px 0 rgba(9,30,66,.15); }
  .t4 .add { font-size: 5px; color: #5E6C84; margin-top: 4px; }

  /* 5 Dark Editorial */
  .t5 { background: #0A192F; color: #8892B0; padding: 10px 12px; font-family: "Inter", sans-serif; display: grid; grid-template-columns: 82px 1fr; gap: 8px; }
  .t5 .rail { border-right: 1px solid #1E2D45; padding-right: 6px; font-family: "JetBrains Mono", monospace; font-size: 5.5px; line-height: 2.2; }
  .t5 .rail b { color: #64FFDA; }
  .t5 .h { display: flex; justify-content: space-between; font-size: 7px; color: #CCD6F6; }
  .t5 .cols { margin-top: 6px; gap: 5px; }
  .t5 .col { border-top: 1px solid #233554; padding-top: 4px; }
  .t5 .ch { font-family: "JetBrains Mono", monospace; font-size: 5px; color: #64FFDA; letter-spacing: .06em; }
  .t5 .card { background: #112240; padding: 4px; margin-top: 4px; font-size: 5.5px; line-height: 1.35; color: #CCD6F6; }

  /* 6 Seasonal */
  .t6 { background: #F5F0E8; color: #191919; padding: 10px 12px; font-family: "Fraunces", serif; }
  .t6 .h { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #D8D0C0; padding-bottom: 4px; }
  .t6 .h b { font-size: 14px; }
  .t6 .h span { font-family: "Inter", sans-serif; font-size: 5.5px; letter-spacing: .1em; color: #7A7264; }
  .t6 .bands { display: grid; grid-template-columns: 1.15fr 1fr 1fr; gap: 6px; margin-top: 7px; height: 220px; }
  .t6 .band { padding: 5px; position: relative; color: #FFF7E6; }
  .t6 .band.red { background: #9E2A1D; }
  .t6 .band.gold { background: #C9A24A; color: #2A2115; }
  .t6 .band.pine { background: #17352F; }
  .t6 .bn { font-family: "Inter", sans-serif; font-size: 5px; letter-spacing: .12em; opacity: .85; }
  .t6 .bt { font-size: 11px; margin-top: 1px; }
  .t6 .card { background: rgba(255,247,230,.14); border: 1px solid rgba(255,247,230,.35); padding: 4px; margin-top: 5px; font-family: "Inter", sans-serif; font-size: 5.5px; line-height: 1.35; }
  .t6 .band.gold .card { background: rgba(42,33,21,.08); border-color: rgba(42,33,21,.25); }
</style>
</head>
<body>
<div class="grid">

  <figure class="cell"><div class="thumb t1">
    <div class="h"><b>KANBAN FLOW</b><span>05 TASKS · RESET</span></div>
    <div class="cols">
      <div class="col"><div class="ch"><span>TO DO</span><span>02</span></div><div class="card">Analyze competitors</div><div class="card">Design high-fidelity wireframes</div></div>
      <div class="col"><div class="ch"><span>IN PROGRESS</span><span>02</span></div><div class="card">Set up the database (Supabase)</div><div class="card">Implement authentication</div></div>
      <div class="col"><div class="ch"><span>DONE</span><span>01</span></div><div class="card">Create the GitHub repository</div><div class="accent"></div></div>
    </div>
  </div><figcaption>01 · Dieter Rams — Instrument</figcaption></figure>

  <figure class="cell"><div class="thumb t2">
    <div class="h"><b>Kanban Flow</b><span>TO DO · IN PROGRESS · DONE</span></div>
    <div class="cols">
      <div class="col"><div class="ch">TO DO / 02</div><div class="card">Analyze competitors</div><div class="card">Design high-fidelity wireframes</div></div>
      <div class="col"><div class="ch">IN PROGRESS / 02</div><div class="card">Set up the database (Supabase)</div><div class="card">Implement authentication</div></div>
      <div class="col"><div class="ch">DONE / 01</div><div class="card">Create the GitHub repository</div></div>
    </div>
  </div><figcaption>02 · Vignelli — Helvetica Grid</figcaption></figure>

  <figure class="cell"><div class="thumb t3">
    <div class="rail">01 TO DO<br><b>02 PROGRESS</b><br>03 DONE<br><br>05 TASKS<br>RESET</div>
    <div>
      <div class="h"><span>Kanban Flow</span><span>17:40</span></div>
      <div class="cols">
        <div class="col"><div class="ch"><span>TO DO</span><span>02</span></div><div class="card">Analyze competitors<span class="tag">todo</span></div><div class="card">Design wireframes</div></div>
        <div class="col"><div class="ch"><span>PROGRESS</span><span>02</span></div><div class="card">Set up Supabase</div><div class="card">Implement auth</div></div>
        <div class="col"><div class="ch"><span>DONE</span><span>01</span></div><div class="card">Create the repository</div></div>
      </div>
    </div>
  </div><figcaption>03 · Linear — Dense Tool</figcaption></figure>

  <figure class="cell"><div class="thumb t4">
    <div class="h"><span>Kanban Flow</span><span>Board</span></div>
    <div class="cols">
      <div class="col"><div class="ch">To Do</div><div class="card">Analyze competitors</div><div class="card">Design high-fidelity wireframes</div><div class="add">+ Add a card</div></div>
      <div class="col"><div class="ch">In Progress</div><div class="card">Set up the database (Supabase)</div><div class="card">Implement authentication</div></div>
      <div class="col"><div class="ch">Done</div><div class="card">Create the GitHub repository</div></div>
    </div>
  </div><figcaption>04 · Trello — Blue Board</figcaption></figure>

  <figure class="cell"><div class="thumb t5">
    <div class="rail">01 / TO DO<br><b>02 / PROGRESS</b><br>03 / DONE<br><br>RESET</div>
    <div>
      <div class="h"><span>Kanban Flow</span><span>05 tasks</span></div>
      <div class="cols">
        <div class="col"><div class="ch">01 / TO DO</div><div class="card">Analyze competitors</div><div class="card">Design wireframes</div></div>
        <div class="col"><div class="ch">02 / PROGRESS</div><div class="card">Set up Supabase</div><div class="card">Implement auth</div></div>
        <div class="col"><div class="ch">03 / DONE</div><div class="card">Create the repository</div></div>
      </div>
    </div>
  </div><figcaption>05 · Dark Editorial — Nightrail</figcaption></figure>

  <figure class="cell"><div class="thumb t6">
    <div class="h"><b>Kanban Flow</b><span>FIVE TASKS · THREE SEASONS</span></div>
    <div class="bands">
      <div class="band red"><div class="bn">01 · VERMILION</div><div class="bt">To Do</div><div class="card">Analyze competitors</div><div class="card">Design high-fidelity wireframes</div></div>
      <div class="band gold"><div class="bn">02 · SAFFRON</div><div class="bt">In Progress</div><div class="card">Set up the database (Supabase)</div><div class="card">Implement authentication</div></div>
      <div class="band pine"><div class="bn">03 · PINE</div><div class="bt">Done</div><div class="card">Create the GitHub repository</div></div>
    </div>
  </div><figcaption>06 · Solar-Term — Seasonal Board</figcaption></figure>

</div>
</body>
</html>
